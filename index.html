<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>牧場 治療・直検ボード</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="直検ボード">
<meta name="theme-color" content="#175645">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  height:100%;

  --paper:#E7EDE9;
  --card:#FFFFFF;
  --ink:#12201B;
  --muted:#556A61;
  --line:#CBD6D0;
  --line-strong:#A9BAB1;

  --treat:#9E3C27;
  --treat-soft:#F7E6E1;
  --exam:#1F6A56;
  --exam-soft:#DDEDE6;
  --warn:#8A5A0B;
  --warn-soft:#F8EBD2;

  --cont:#1F4E8C;
  --cont-soft:#DCE6F5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1512;
    --card:#19221E;
    --ink:#E7EFE9;
    --muted:#95A9A0;
    --line:#2A3833;
    --line-strong:#3D4F48;
    --treat:#E08C72;
    --treat-soft:#3A241D;
    --exam:#6DC1A4;
    --exam-soft:#152F27;
    --warn:#D9A84E;
    --warn-soft:#332614;

    --cont:#8FB6E8;
    --cont-soft:#17283F;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1512;
  --card:#19221E;
  --ink:#E7EFE9;
  --muted:#95A9A0;
  --line:#2A3833;
  --line-strong:#3D4F48;
  --treat:#E08C72;
  --treat-soft:#3A241D;
  --exam:#6DC1A4;
  --exam-soft:#152F27;
  --warn:#D9A84E;
  --warn-soft:#332614;

  --cont:#8FB6E8;
  --cont-soft:#17283F;
}
*,*::before,*::after{box-sizing:inherit}

body{
  margin:0;height:100%;
  display:flex;flex-direction:column;
  background:var(--paper);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.6;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- header ---------- */
.top{
  flex:none;background:var(--card);border-bottom:1px solid var(--line);
  padding:10px 14px 8px;
}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand{font-size:17px;font-weight:700;letter-spacing:.02em;margin:0}
.today-label{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.top-right{display:flex;align-items:center;gap:6px;flex:none}
.top-right .btn.sm{padding:6px 10px;font-size:13px;min-height:40px}
@media (max-width:420px){ .today-label{display:none} }

.toggle-row{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  appearance:none;background:var(--card);border:1px solid var(--line-strong);
  border-radius:10px;padding:12px;min-height:54px;margin-top:8px;cursor:pointer;text-align:left;
}
.toggle-row:first-of-type{margin-top:0}
.toggle-label{font-size:15px}
.toggle-state{
  flex:none;font-size:13px;font-weight:700;color:var(--muted);
  border:1px solid var(--line-strong);border-radius:999px;padding:4px 14px;
}
.toggle-row[aria-pressed="true"]{border-color:var(--exam);background:var(--exam-soft)}
.toggle-row[aria-pressed="true"] .toggle-state{color:var(--exam);border-color:var(--exam)}
.toggle-row:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.banner{
  margin-top:8px;padding:8px 10px;border-radius:8px;
  background:var(--warn-soft);color:var(--ink);font-size:13px;line-height:1.5;
  border:1px solid var(--line);
}

/* ---------- main ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 24px}
.stack{display:flex;flex-direction:column;gap:10px}

.section-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin:18px 2px 8px;
}
.section-head:first-child{margin-top:2px}
.section-title{font-size:14px;font-weight:700;margin:0}
.section-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.section-title.danger,.section-count.danger{color:var(--treat)}

/* ---------- record card ---------- */
.card{
  background:var(--card);border:1px solid var(--line);
  border-left:5px solid var(--line-strong);
  border-radius:10px;padding:12px 13px;
  width:100%;text-align:left;display:block;cursor:pointer;
}
.card.t{border-left-color:var(--treat)}
.card.e{border-left-color:var(--exam)}
.card.done{border-left-color:var(--line-strong);opacity:.72}
.card.late{border-left-color:var(--treat);background:var(--treat-soft)}
.card.st-preg{border-left-color:var(--exam)}
.card.st-wait{border-left-color:var(--treat)}
.card.st-cont{border-left-color:var(--cont)}
.card.st-none{border-left-color:var(--line-strong)}
.card:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.horse{font-size:21px;font-weight:700;line-height:1.25;letter-spacing:.01em;word-break:break-word}
.place{font-size:13px;color:var(--muted);margin-left:8px;font-weight:400}
.hcat{
  font-size:12px;font-weight:700;margin-left:8px;vertical-align:middle;
  display:inline-block;border:1px solid var(--line-strong);border-radius:999px;
  padding:1px 9px;color:var(--muted);background:var(--paper);white-space:nowrap;
}
.line{margin-top:5px;font-size:14px;word-break:break-word}
.line.sub{color:var(--muted);font-size:13px}
.meta{
  margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;
  font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
}
.chip{
  display:inline-block;padding:2px 8px;border-radius:999px;
  font-size:12px;font-weight:700;line-height:1.7;
}
.chip.t{background:var(--treat-soft);color:var(--treat)}
.chip.e{background:var(--exam-soft);color:var(--exam)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.n{background:var(--paper);color:var(--muted)}
.chip.b{background:var(--cont-soft);color:var(--cont)}

.empty{
  border:1px dashed var(--line-strong);border-radius:10px;
  padding:18px 14px;text-align:center;color:var(--muted);font-size:14px;
}

/* ---------- buttons ---------- */
.btn{
  appearance:none;border:1px solid var(--line-strong);background:var(--card);
  border-radius:10px;padding:12px 14px;font-size:15px;font-weight:700;
  cursor:pointer;min-height:48px;
}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn.fill{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.t{background:var(--treat);border-color:var(--treat);color:#fff}
.btn.e{background:var(--exam);border-color:var(--exam);color:#fff}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 auto}

.newbar{display:flex;gap:8px;margin-bottom:4px}

/* ---------- filter ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px}
.filters button{
  appearance:none;white-space:nowrap;border:1px solid var(--line-strong);
  background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;
  min-height:40px;cursor:pointer;
}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}

.seg{display:flex;gap:6px}
.seg button{
  flex:1;appearance:none;border:1px solid var(--line-strong);background:var(--paper);
  border-radius:9px;padding:10px 6px;font-size:14px;min-height:48px;cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.seg button:disabled{opacity:.45}
.seg button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.rows{margin-top:8px;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:baseline}
.row-label{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.row-value{font-size:14px;word-break:break-word;font-variant-numeric:tabular-nums}
.row-value strong{font-weight:700;font-size:15px}

.preview{display:block}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:none}
.prow-label{font-size:13px;color:var(--muted)}
.prow-date{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.prow-empty{font-size:13px;color:var(--muted)}

/* 左右の卵胞を並べて選ぶ */
.ovaries{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px;align-items:start}
.ovary{
  border:1px solid var(--line-strong);border-radius:12px;
  padding:8px;background:var(--card);min-width:0;
}
.ovary-toggle{
  width:100%;appearance:none;cursor:pointer;padding:6px 4px;
  background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;
  min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  margin-bottom:8px;
}
.ot-title{font-size:14px;font-weight:700;color:var(--ink)}
.ot-val{
  font-size:16px;font-weight:700;color:var(--exam);
  font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px;
}
.ot-val.ot-empty{color:var(--muted);font-weight:400}
.ot-arrow{font-size:12px;line-height:1;display:inline-block}
.ovary-toggle[aria-expanded="true"] .ot-arrow{transform:rotate(180deg)}
.ovary-toggle:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cl-btn{
  width:100%;appearance:none;cursor:pointer;
  border:2px solid var(--treat);background:var(--card);color:var(--treat);
  border-radius:10px;min-height:56px;font-size:17px;font-weight:700;
  margin-bottom:8px;padding:0;
}
.cl-btn[aria-pressed="true"]{background:var(--treat);color:#fff}
.cl-btn:focus-visible,.size-btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.sizes[hidden]{display:none}
.size-btn{
  appearance:none;cursor:pointer;padding:0;
  border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);
  border-radius:9px;min-height:54px;font-size:16px;line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.size-btn[aria-pressed="true"]{
  background:var(--exam);border-color:var(--exam);color:#fff;font-weight:700;
}
.ovary-note{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}

/* 子宮の浮腫 */
.edema{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.ed-btn{
  appearance:none;cursor:pointer;padding:0;
  border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);
  border-radius:9px;min-height:54px;font-size:15px;line-height:1.1;font-weight:700;
}
.ed-btn[aria-pressed="true"]{background:var(--exam);border-color:var(--exam);color:#fff}
.ed-btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.sched-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sched-row>div:first-child{min-width:0}
.sched-row>h3{margin:0}

/* 馬名でさがす */
.search{position:relative;margin-bottom:10px}
.search-row{display:flex;gap:6px;align-items:center}
.search-input{
  flex:1;min-width:0;appearance:none;
  border:1px solid var(--line-strong);border-radius:10px;background:var(--card);
  padding:10px 12px;font-size:16px;color:var(--ink);
}
.search-clear{
  appearance:none;cursor:pointer;border:1px solid var(--line-strong);background:var(--card);
  color:var(--muted);border-radius:10px;min-width:46px;min-height:46px;font-size:17px;line-height:1;padding:0;
}
.search-clear:focus-visible,.search-input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.suggest{
  position:absolute;left:0;right:52px;top:100%;z-index:5;margin-top:4px;
  background:var(--card);border:1px solid var(--line-strong);border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,.14);max-height:320px;overflow-y:auto;
}
.suggest[hidden]{display:none}
.suggest-item{
  display:flex;width:100%;align-items:baseline;gap:8px;
  appearance:none;cursor:pointer;background:none;border:none;
  border-top:1px solid var(--line);padding:12px;text-align:left;
  font-size:16px;font-weight:700;color:var(--ink);
}
.suggest-item:first-child{border-top:none}
.suggest-item .sub{font-size:12px;font-weight:400;color:var(--muted)}

.tally{display:flex;gap:8px;margin-bottom:10px}
.tally>div{
  flex:1;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:8px 6px;text-align:center;
}
.tally .n{display:block;font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.tally .l{display:block;font-size:12px;color:var(--muted)}

.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-title{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.cal-nav{
  appearance:none;border:1px solid var(--line-strong);background:var(--card);
  border-radius:10px;min-width:52px;min-height:44px;font-size:20px;line-height:1;cursor:pointer;
}
.cal-nav:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:16px}
.cal-wd{text-align:center;font-size:11px;color:var(--muted);padding:2px 0}
.cal-wd.sun{color:var(--treat)}
.cal-wd.sat{color:var(--exam)}
.cal-pad{min-height:48px}
.cal-cell{
  appearance:none;border:1px solid var(--line);background:var(--card);
  border-radius:8px;min-height:48px;padding:3px 0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.cal-d{font-size:13px;line-height:1.1;font-variant-numeric:tabular-nums}
.cal-n{font-size:12px;font-weight:700;line-height:1.1;min-height:14px;color:var(--exam)}
.cal-cell.has{background:var(--exam-soft);border-color:var(--exam)}
.cal-cell.late{background:var(--warn-soft);border-color:var(--warn)}
.cal-cell.late .cal-n{color:var(--warn)}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-cell.sel{background:var(--ink);border-color:var(--ink)}
.cal-cell.sel .cal-d,.cal-cell.sel .cal-n{color:var(--paper)}
.cal-cell:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px;margin:-8px 0 14px;font-size:12px;color:var(--muted)}
.cal-foal{display:block;width:6px;height:6px;border-radius:50%;background:var(--treat)}
.cal-cell.sel .cal-foal{background:var(--paper)}

/* ---------- tabs ---------- */
.tabs{
  flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);
}
.tabs button{
  flex:1;appearance:none;background:none;border:none;cursor:pointer;
  padding:9px 2px 11px;font-size:11.5px;font-weight:700;color:var(--muted);
  border-top:3px solid transparent;min-height:56px;line-height:1.25;
  word-break:keep-all;
}
.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--ink)}
.tabs .tab-n{display:block;font-size:18px;line-height:1.2;font-variant-numeric:tabular-nums}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:none}
.sheet.open{display:block}
.sheet-back{position:absolute;inset:0;background:rgba(6,14,11,.55)}
.sheet-panel{
  position:absolute;left:0;right:0;bottom:0;max-height:94%;
  display:flex;flex-direction:column;
  background:var(--paper);border-radius:16px 16px 0 0;
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.sheet-head{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 14px 10px;border-bottom:1px solid var(--line);
}
.sheet-head h2{margin:0;font-size:16px;font-weight:700}
.sheet-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.sheet-foot{flex:none;padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-foot>.btn{flex:1}

.field{display:block}
.field-label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.field-hint{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.field input,.field select,.field textarea{
  width:100%;background:var(--card);border:1px solid var(--line-strong);
  border-radius:9px;padding:11px 12px;min-height:48px;
}
.field textarea{min-height:84px;resize:vertical;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid var(--ink);outline-offset:1px}

.detail-block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
.detail-block h3{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--muted)}
.log{padding:9px 0;border-top:1px solid var(--line)}
.log:first-of-type{border-top:none}
.log-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.log-text{margin-top:2px;white-space:pre-wrap;word-break:break-word}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(76px + env(safe-area-inset-bottom, 0px));
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;
  font-size:14px;font-weight:700;z-index:60;max-width:90%;text-align:center;
}
@media (prefers-reduced-motion:no-preference){
  .sheet.open .sheet-panel{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(14px)}to{transform:none}}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <h1 class="brand">治療・直検ボード</h1>
    <div class="top-right">
      <span class="today-label" id="todayLabel"></span>
      <button class="btn sm" id="langBtn">日本語</button>
      <button class="btn sm" id="whoBtn">名前</button>
      <button class="btn sm" id="settingsBtn">設定</button>
    </div>
  </div>
  <div class="banner" id="banner" hidden></div>
</header>

<main id="view"><div class="empty">読み込んでいます…</div></main>

<nav class="tabs" id="tabs" role="tablist">
  <button role="tab" data-tab="today" aria-selected="true"><span class="tab-n" id="n-today">—</span>今日の直検</button>
  <button role="tab" data-tab="todaytreat" aria-selected="false"><span class="tab-n" id="n-todaytreat">—</span>今日の治療</button>
  <button role="tab" data-tab="treat" aria-selected="false"><span class="tab-n" id="n-treat">—</span>治療</button>
  <button role="tab" data-tab="exam" aria-selected="false"><span class="tab-n" id="n-exam">—</span>直検</button>
  <button role="tab" data-tab="cal" aria-selected="false"><span class="tab-n" id="n-cal">—</span>予定表</button>
</nav>

<div class="sheet" id="sheet">
  <div class="sheet-back" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="btn sm" data-close>閉じる</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>

<datalist id="horseNames"></datalist>
<datalist id="stallionNames"></datalist>

<script>
/* 牧場コードはURLの ?farm= から受け取る */
var FARM_CODE = (function(){
  try{
    var p = new URLSearchParams(location.search);
    return (p.get("farm") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 32);
  }catch(e){ return ""; }
})();
</script>
<script>
(function(){
"use strict";
var FARM = (typeof FARM_CODE === "string") ? FARM_CODE : "";
/* ============ 言語（日本語 / English / हिन्दी） ============ */
var LANG = "ja";
try{ LANG = localStorage.getItem("board.lang") || "ja"; }catch(e){}
function setLang(v){
  LANG = v;

  if(!d) return s;

}

function trl(s){
  if(LANG === "ja" || !s) return s;
  var d = DICT[LANG];
  if(!d) return s;
  if(d[s] !== undefined) return d[s];
  var m = /^分娩後(\d+)日$/.exec(s);
  if(m) return trf("分娩後{n}日", { n: m[1] });

}

  var s = (LANG === "ja") ? key : ((DICT[LANG] && DICT[LANG][key] !== undefined) ? DICT[LANG][key] : key);
  return s.replace(/\{(\w+)\}/g, function(_, k){
    return (vars && vars[k] !== undefined) ? String(vars[k]) : "";
  });
}

function el(tag, cls, text){

function pad(n){ return (n<10?"0":"") + n; }
function todayStr(){

function fmtDate(s){
  if(!s) return "";
  var p = String(s).split("-");
  if(p.length !== 3) return String(s);
  var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  if(isNaN(d.getTime())) return String(s);
  return Number(p[1]) + "/" + Number(p[2]) + "(" + WD_ALL[LANG][d.getDay()] + ")";
}
function daysFrom(a, b){
  var pa = String(a).split("-"), pb = String(b).split("-");
  if(pa.length!==3 || pb.length!==3) return 0;
  var da = Date.UTC(+pa[0], +pa[1]-1, +pa[2]);
  var db_ = Date.UTC(+pb[0], +pb[1]-1, +pb[2]);
  return Math.round((db_ - da) / 86400000);
}

function server(){ return booted ? fdb : null; }

function refOf(kind, id){ return FB.doc(fdb, FARM_DOC + "/" + kind + "/" + id); }

function newId(kind){
  var a = new Uint8Array(5), s = "";
  crypto.getRandomValues(a);
  for(var i=0;i<a.length;i++) s += ("0" + a[i].toString(16)).slice(-2);
  return kind.charAt(0) + s;
}

function hhmm(ms){
  var d = new Date(ms);
  return pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function pendingTotal(){
  var n = 0;
  Object.keys(pend).forEach(function(k){ n += pend[k] || 0; });
  return n;
}

function updateStatus(){
  if(locked) return;
  var parts = [];
  if(fromCache){
    parts.push(tr("オフラインです。入力はこの端末に保存され、電波が入ると自動で送られます"));
    if(lastSyncAt) parts.push(trf("最終同期 {t}", { t: hhmm(lastSyncAt) }));
  }
  var n = pendingTotal();
  if(n > 0) parts.push(trf("未送信 {n} 件", { n: n }));
  if(writeError) parts.push(tr("保存できなかったデータがあります。クリニックにご連絡ください"));
  setBanner(parts.join("　/　"));
}

function noteSync(key, md, pendingCount){
  cacheFlag[key] = !!(md && md.fromCache);
  if(pendingCount !== undefined) pend[key] = pendingCount;
  var live = false;
  Object.keys(cacheFlag).forEach(function(k){ if(!cacheFlag[k]) live = true; });
  fromCache = !live;
  if(live) lastSyncAt = Date.now();
  updateStatus();
}

/* ----- 合言葉（この端末の画面ロック） ----- */
function sha256Hex(s){
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(h){
    return Array.prototype.map.call(new Uint8Array(h), function(b){
      return ("0" + b.toString(16)).slice(-2);
    }).join("");
  });
}
function passMatches(pass){
  var p = S.pass;
  if(!p || !p.hash) return Promise.resolve(true);
  return sha256Hex(String(p.salt) + "|" + String(pass || "")).then(function(h){ return h === p.hash; });
}
function setPasscodeRemote(newPass){
  var np = String(newPass || "").trim();
  var ref = FB.doc(fdb, FARM_DOC + "/access/pass");
  if(!np){
    localWrite(function(){ return FB.deleteDoc(ref); });
    return Promise.resolve({ hasPass: false });
  }
  var salt = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random());
  return sha256Hex(salt + "|" + np).then(function(h){
    localWrite(function(){ return FB.setDoc(ref, { salt: salt, hash: h }); });
    return { hasPass: true };
  });
}

function callServerAs(pass, fnName){
  var args = Array.prototype.slice.call(arguments, 2);
  if(fnName === "checkPass"){
    return passMatches(pass).then(function(ok){ return { ok: ok }; });
  }
  if(fnName === "setPasscode"){
    return setPasscodeRemote(args[0]);
  }
  return Promise.reject({ code:"unsupported", message: tr("この操作はこの画面ではできません") });
}
function callServer(fnName){
  var args = Array.prototype.slice.call(arguments, 1);
  return callServerAs.apply(null, [passcode, fnName].concat(args));
}

/* 画面側のコードをそのまま動かすための橋渡し（保存先は Firestore） */
var db = {
  doc: function(path){
    var p = String(path).split("/");
    var kind = p[0], id = p[1];
    return {
      set: function(body){ return writeDoc(kind, id, body, false); },
      "delete": function(){
        return localWrite(function(){ return FB.deleteDoc(refOf(kind, id)); });
      }
    };
  },
  collection: function(name){
    return {
      add: function(body){
        var id = newId(name);
        return writeDoc(name, id, body, true).then(function(){ return id; });
      }
    };
  }
};

/* 書き込みは、まずこの端末の中に入れて、すぐ画面を次に進めます。
   サーバーへ送るのは Firestore が裏でやります（電波が戻ってからでも大丈夫）。 */
function localWrite(fn){
  return new Promise(function(resolve, reject){
    var p;
    try{ p = fn(); }
    catch(e){ reject(e); return; }
    if(p && typeof p.then === "function"){
      p.then(function(){ writeError = ""; }, function(err){
        /* ここに来るのは、権限などで受け取ってもらえなかったとき */
        writeError = String((err && err.code) || err || "");
        updateStatus();
      });
    }
    resolve();
  });
}

function str(v){ return (v === undefined || v === null) ? "" : String(v); }

function cleanRec(r){
  r = r || {};
  var out = {};
  ["kind","label","date","result","memo","by","at","lf","rf","cl","ed"].forEach(function(k){
    out[k] = str(r[k]);
  });
  return out;
}

var MARE_FIELDS = ["horse","place","foalingDate","breedingDate","stallion","category2","owner",
                   "category","note","createdBy","createdAt","updatedAt"];

/* 画面が渡してくる「馬まるごと」を、保存の形に直す */
function toStore(body){
  var o = {};
  MARE_FIELDS.forEach(function(k){ o[k] = str(body[k]); });
  o.manual = (body.manual && body.manual.date) ? {
    date: str(body.manual.date), label: str(body.manual.label), memo: str(body.manual.memo)
  } : null;
  o.done = {};
  var d = body.done || {};
  Object.keys(d).forEach(function(k){ o.done[k] = cleanRec(d[k]); });
  o.others = {};
  (body.others || []).forEach(function(x){
    if(!x || !x.id) return;
    o.others[String(x.id)] = {
      date: str(x.date), title: str(x.title), memo: str(x.memo), by: str(x.by)
    };
  });
  return o;
}

/* 変わったところだけを書く。
   こうすると、同じ馬を二人が別々に触っても、お互いの入力が消えません。 */
function mareDiff(prev, next){
  var args = [];
  function push(path, val){ args.push(path, val); }
  MARE_FIELDS.forEach(function(k){
    if(str(prev[k]) !== next[k]) push(k, next[k]);
  });
  if(JSON.stringify(prev.manual || null) !== JSON.stringify(next.manual)) push("manual", next.manual);
  var pd = prev.done || {}, nd = next.done || {};
  Object.keys(nd).forEach(function(k){
    if(JSON.stringify(pd[k]) !== JSON.stringify(nd[k])) push(new FB.FieldPath("done", k), nd[k]);
  });
  Object.keys(pd).forEach(function(k){
    if(!(k in nd)) push(new FB.FieldPath("done", k), FB.deleteField());
  });
  var po = prev.others || {}, no = next.others || {};
  Object.keys(no).forEach(function(k){
    if(JSON.stringify(po[k]) !== JSON.stringify(no[k])) push(new FB.FieldPath("others", k), no[k]);
  });
  Object.keys(po).forEach(function(k){
    if(!(k in no)) push(new FB.FieldPath("others", k), FB.deleteField());
  });
  return args;
}

function flat(body, keys){
  var o = {};
  keys.forEach(function(k){ o[k] = str(body[k]); });
  return o;
}

function writeDoc(kind, id, body, isNew){
  var ref = refOf(kind, id);
  if(kind === "mares"){
    var m = toStore(body);
    var prev = S.mares[id];
    if(isNew || !prev){
      return localWrite(function(){ return FB.setDoc(ref, m); });
    }
    var args = mareDiff(prev, m);
    if(!args.length) return Promise.resolve();
    return localWrite(function(){
      return FB.updateDoc.apply(null, [ref].concat(args));
    });
  }
  if(kind === "settings"){
    var s = {
      foalOffset: Number(body.foalOffset) || 8,
      gestation: Number(body.gestation) || 340,
      dueMode: (body.dueMode === "calendar") ? "calendar" : "days",
      steps: body.steps || {},
      barns: (body.barns || []).map(function(x){ return String(x); })
    };
    return localWrite(function(){ return FB.setDoc(ref, s); });
  }
  if(kind === "treatments"){
    return localWrite(function(){
      return FB.setDoc(ref, flat(body, ["horse","place","problem","plan","startDate",
                                        "status","createdBy","createdAt","updatedAt"]),
                       { merge: true });
    });
  }
  if(kind === "logs"){
    return localWrite(function(){
      return FB.setDoc(ref, flat(body, ["treatmentId","date","text","by","at"]), { merge: true });
    });
  }
  return Promise.reject({ code:"unknown", message:"不明な保存先: " + kind });
}

/* ----- 受け取り（変わったら自動で画面に出る） ----- */
function startListening(){
  var opts = { includeMetadataChanges: true };

  function one(key, path, onDoc){
    FB.onSnapshot(FB.doc(fdb, path), opts, function(s){
      onDoc(s.exists() ? s.data() : null, s);
      got[key] = true;
      noteSync(key, s.metadata, s.metadata.hasPendingWrites ? 1 : 0);
      if(key === "pass") checkLock();
      pushData();
    }, onListenError);
  }

  one("meta", FARM_DOC + "/meta/info", function(v, s){
    S.meta = v;
    /* サーバーまで届いていて、その牧場が無いときだけ「牧場がありません」を出す。
       電波がないときは出さない（この端末の控えに無いだけかもしれないため）。 */
    if(!v && s && !s.metadata.fromCache && !s.metadata.hasPendingWrites) noFarm = true;
  });
  one("settings", FARM_DOC + "/settings/schedule", function(v){ S.settings = v; });
  one("pass",     FARM_DOC + "/access/pass",       function(v){ S.pass = v; });

  ["mares","treatments","logs"].forEach(function(k){
    FB.onSnapshot(FB.collection(fdb, FARM_DOC + "/" + k), opts, function(qs){
      var map = {}, n = 0;
      qs.forEach(function(d){
        map[d.id] = d.data();
        if(d.metadata.hasPendingWrites) n++;
      });
      if(!n && qs.metadata.hasPendingWrites) n = 1;
      S[k] = map;
      got[k] = true;
      noteSync(k, qs.metadata, n);
      pushData();
    }, onListenError);
  });
}

/* 同じIDのものは、入れものはそのままに中身だけ入れ替える */
function mergeList(oldArr, newArr){
  var byId = {};
  (oldArr || []).forEach(function(o){ if(o && o.id) byId[o.id] = o; });
  return (newArr || []).map(function(n){
    var o = byId[n.id];
    if(!o) return n;
    Object.keys(o).forEach(function(k){ if(!(k in n)) delete o[k]; });
    Object.keys(n).forEach(function(k){ o[k] = n[k]; });
    return o;
  });
}

function activeTreatments(){

}
function lastLogDate(treatmentId){
  var best = "";
  for(var i=0;i<logs.length;i++){
    var l = logs[i];
    if(l.treatmentId === treatmentId && typeof l.date === "string" && l.date > best) best = l.date;

/* --- 繁殖の予定日を計算する --- */
/** 2つの日付の間の日数 */
function diffDays(a, b){
  var pa = String(a).split("-"), pb = String(b).split("-");
  if(pa.length !== 3 || pb.length !== 3) return 0;
  var da = Date.UTC(Number(pa[0]), Number(pa[1])-1, Number(pa[2]));
  var db2 = Date.UTC(Number(pb[0]), Number(pb[1])-1, Number(pb[2]));
  return Math.round((db2 - da) / 86400000);
}
function addDays(dateStr, n){
  var p = String(dateStr).split("-");
  if(p.length !== 3) return "";
  var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  if(isNaN(d.getTime())) return "";
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}
var ALL_STEPS = [[15,"種付後15日"],[18,"種付後18日"],[21,"3週"],[28,"4週"],[35,"5週"]];
function stepOn(n){
  if(!settings || !settings.steps) return true;
  return settings.steps[String(n)] !== false;
}
function breedSteps(){
  return ALL_STEPS.filter(function(s){ return stepOn(s[0]); });
}
function foalOffset(){
  var v = settings ? Number(settings.foalOffset) : 0;
  return (v > 0 && v < 100) ? v : 8;
}
function gestationDays(){
  var v = settings ? Number(settings.gestation) : 0;
  return (v > 200 && v < 400) ? v : 340;
}

/* 分娩予定日の出し方。
   days     … 種付日から決まった日数（既定340日）
   calendar … 種付日の1ヶ月前の日付の、1年あと
              （例：2月12日に種付 → 翌年1月12日が分娩予定）
   暦のほうは、31日など相手の月に無い日は、その月の末日にします。 */
function dueMode(){
  return (settings && settings.dueMode === "calendar") ? "calendar" : "days";
}

function dueByCalendar(ds){
  if(!ds) return "";
  var p = String(ds).split("-");
  if(p.length !== 3) return "";
  var y = Number(p[0]), mo = Number(p[1]), d = Number(p[2]);
  if(!y || !mo || !d) return "";
  mo -= 1;
  if(mo < 1){ mo = 12; y -= 1; }
  y += 1;
  var last = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  if(d > last) d = last;
  return y + "-" + pad(mo) + "-" + pad(d);
}

/** 種付日から分娩予定日を出す（設定した出し方に従う） */
function dueFrom(breedingDate){
  if(!breedingDate) return "";
  return (dueMode() === "calendar")
    ? dueByCalendar(breedingDate)
    : addDays(breedingDate, gestationDays());
}

/** 種付日から分娩予定日までの日数（画面に出すため） */
function dueSpan(breedingDate){
  var d = dueFrom(breedingDate);
  if(!d) return gestationDays();
  return diffDays(breedingDate, d);
}

/** 受胎が確認できている馬の分娩予定日。それ以外は空 */
function expectedFoaling(m){
  if(!m.breedingDate) return "";
  if(mareStatus(m) !== "受胎") return "";
  return dueFrom(m.breedingDate);
}
function foalingByDate(){
  var map = {};
  mares.forEach(function(m){
    var d = expectedFoaling(m);
    if(d) (map[d] = map[d] || []).push(m);
  });
  return map;
}
function stepsLabel(){
  var b = breedSteps();
  if(!b.length) return tr("（妊娠鑑定の項目はすべて外れています）");
  return b.map(function(s){ return trl(s[1]).replace("種付後",""); }).join("・");
}

function scheduleFor(m){
  var out = [];
  if(m.foalingDate){
    out.push({
      key: "f" + foalOffset() + "@" + m.foalingDate,
      kind: "直検",
      label: foalLabelJa(),
      date: addDays(m.foalingDate, foalOffset())
    });
  }
  if(m.breedingDate){
    breedSteps().forEach(function(s){
      out.push({
        key: "b" + s[0] + "@" + m.breedingDate,
        kind: "妊娠鑑定",
        label: s[1],
        date: addDays(m.breedingDate, s[0])
      });
    });
  }
  if(m.manual && m.manual.date){
    out.push({
      key: "m@" + m.manual.date + "@" + (m.manual.label || ""),
      kind: "直検",
      label: m.manual.label || "次の直検（手入力）",
      date: m.manual.date,
      manual: true
    });
  }
  (m.others || []).forEach(function(o){
    out.push({
      key: "o@" + o.id,
      kind: "その他処置",
      label: o.title || "その他処置",
      date: o.date,
      other: o
    });
  });
  var doneMap = m.done || {};
  out.forEach(function(it){ it.done = doneMap[it.key] || null; it.mare = m; });
  out.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
  return out;
}
function pendingFor(m){
  return scheduleFor(m).filter(function(it){ return !it.done && it.date; });
}
function nextItem(m, kind){
  var p = pendingFor(m);
  if(kind) p = p.filter(function(it){ return it.kind === kind; });
  return p[0] || null;
}
function nextExam(m){
  return pendingFor(m)[0] || null;
}
function lastDone(m, kind){
  var d = scheduleFor(m).filter(function(it){ return it.done && (!kind || it.kind === kind); });
  return d.length ? d[d.length-1] : null;
}
function dueItems(limitDate){
  var out = [];
  mares.forEach(function(m){
    pendingFor(m).forEach(function(it){
      if(!limitDate || it.date <= limitDate) out.push(it);
    });
  });
  out.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
  return out;
}
var PREG_POSITIVE = {"受胎":1,"双子":1,"妊娠確認":1};  // 妊娠確認は以前の記録用
function latestPregDone(m){
  var d = m.done || {};
  var arr = Object.keys(d).map(function(k){ return d[k]; })
    .filter(function(x){ return x && x.kind === "妊娠鑑定"; })
    .sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
  return arr.length ? arr[arr.length-1] : null;
}
/** 今の種付日に対する、いちばん新しい妊娠鑑定の結果 */
function currentPregDone(m){
  if(!m.breedingDate) return null;
  var d = m.done || {};
  var arr = Object.keys(d)
    .filter(function(k){ return k.indexOf("@" + m.breedingDate) > 0; })
    .map(function(k){ return d[k]; })
    .filter(function(x){ return x && x.kind === "妊娠鑑定"; })
    .sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
  return arr.length ? arr[arr.length-1] : null;
}
function mareStatus(m){
  if(m.breedingDate){
    var last = currentPregDone(m);
    if(last && PREG_POSITIVE[last.result]) return "受胎";
    if(!last) return "妊娠鑑定待ち";
    return "直検継続";
  }
  if(!m.foalingDate && !(m.manual && m.manual.date) && !((m.others || []).length)) return "未設定";
  return "直検継続";
}
function statusChipClass(st){
  return st === "受胎" ? "e" : st === "妊娠鑑定待ち" ? "t" : st === "直検継続" ? "b" : "n";
}
function stageClass(st){
  return st === "受胎" ? "st-preg" : st === "妊娠鑑定待ち" ? "st-wait"
       : st === "直検継続" ? "st-cont" : "st-none";
}
/* 並び順：受胎 → 妊娠鑑定待ち → 直検継続 → 未設定 */
var STAGE_ORDER = { "受胎":0, "妊娠鑑定待ち":1, "直検継続":2, "未設定":3 };
function byStage(a, b){
  var sa = mareStatus(a), sb = mareStatus(b);
  if(STAGE_ORDER[sa] !== STAGE_ORDER[sb]) return STAGE_ORDER[sa] - STAGE_ORDER[sb];
  if(sa === "受胎" || sa === "妊娠鑑定待ち"){
    var da = a.breedingDate || "9999-99-99";
    var db2 = b.breedingDate || "9999-99-99";
    if(da !== db2) return da.localeCompare(db2);
  }
  var na = nextItem(a, null), nb = nextItem(b, null);
  if(na && nb && na.date !== nb.date) return String(na.date).localeCompare(String(nb.date));
  if(na && !nb) return -1;
  if(!na && nb) return 1;
  return sortByHorse(a, b);
}
function horseNames(){
  var set = {};
  treatments.forEach(function(t){ if(t.horse) set[t.horse] = 1; });
  mares.forEach(function(m){ if(m.horse) set[m.horse] = 1; });
  return Object.keys(set).sort();
}
function sortByHorse(a,b){ return String(a.horse||"").localeCompare(String(b.horse||""),"ja"); }

/* さがすとき用に名前をならす。ひらがな・半角カナ・大文字小文字・中黒の違いは無視する */
function normName(s){
  s = String(s == null ? "" : s);
  try{ s = s.normalize("NFKC"); }catch(e){ }
  s = s.replace(/[\u3041-\u3096]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) + 0x60); });
  return s.toLowerCase().replace(/[\s\u3000・]/g, "");
}

/* ----- 直検タブ ----- */
function paintExam(view){
  var bar = el("div","newbar");
  var addBtn = el("button","btn e wide",tr("繁殖牝馬を登録"));
  addBtn.disabled = !canWrite();
  addBtn.addEventListener("click", function(){ openMareForm(null); });
  bar.appendChild(addBtn);
  view.appendChild(bar);

  var tally = {"直検継続":0, "妊娠鑑定待ち":0, "受胎":0, "未設定":0};
  mares.forEach(function(m){ tally[mareStatus(m)]++; });
  var tl = el("div","tally");
  [["直検継続", tally["直検継続"]], ["妊娠鑑定待ち", tally["妊娠鑑定待ち"]], ["受胎", tally["受胎"]], ["全頭", mares.length]].forEach(function(p){
    var d = el("div");
    d.appendChild(el("span","n", String(p[1])));
    d.appendChild(el("span","l", tr(p[0])));
    tl.appendChild(d);
  });
  view.appendChild(tl);

  var f = el("div","filters");
  ["今日","今週","直検継続","妊娠鑑定待ち","受胎","全頭"].forEach(function(p){
    var b = el("button", null, tr(p));
    b.setAttribute("aria-pressed", examFilter === p ? "true" : "false");
    b.addEventListener("click", function(){ examFilter = p; mareQuery = ""; paint(); });
    f.appendChild(b);
  });
  view.appendChild(f);

  /* ----- 馬名でさがす ----- */
  var search = el("div","search");
  var srow = el("div","search-row");
  var si = inp("text", mareQuery, tr("馬名でさがす"));
  si.className = "search-input";
  si.autocomplete = "off";
  si.setAttribute("aria-label", tr("馬名でさがす"));
  srow.appendChild(si);
  var sclr = el("button","search-clear","✕");
  sclr.type = "button";
  sclr.setAttribute("aria-label", tr("消す"));
  srow.appendChild(sclr);
  search.appendChild(srow);
  var sug = el("div","suggest");
  sug.hidden = true;
  search.appendChild(sug);
  view.appendChild(search);

  var listBox = el("div");
  view.appendChild(listBox);

  /* 入力に当てはまる馬。入力がなければ null（＝さがしていない） */
  function hits(){
    var q = normName(mareQuery);
    if(!q) return null;
    return mares.filter(function(m){ return normName(m.horse).indexOf(q) >= 0; });
  }

  function fillSuggest(){
    sug.textContent = "";
    var q = normName(mareQuery);
    var found = hits();
    if(!q || !found || !found.length){ sug.hidden = true; return; }
    found.slice().sort(function(a, b){
      var ai = normName(a.horse).indexOf(q), bi = normName(b.horse).indexOf(q);
      if(ai !== bi) return ai - bi;        /* 頭から一致するものを先に */
      return sortByHorse(a, b);
    }).slice(0, 8).forEach(function(m){
      var b = el("button","suggest-item");
      b.type = "button";
      b.appendChild(el("span", null, m.horse || tr("（馬名なし）")));
      var tail = [];
      if(cat2Of(m) === "預託馬") tail.push(tr("預託"));
      if(m.place) tail.push(m.place);
      if(tail.length) b.appendChild(el("span","sub", tail.join("・")));
      /* 押したときに入力欄から外れてしまわないように */
      b.addEventListener("mousedown", function(ev){ ev.preventDefault(); });
      b.addEventListener("click", function(){ sug.hidden = true; openMareDetail(m.id); });
      sug.appendChild(b);
    });
    sug.hidden = false;
  }

  function fillList(){
    listBox.textContent = "";
    var found = hits();
    if(found){
      if(!found.length){
        listBox.appendChild(el("div","empty", tr("その名前の馬は見つかりません。")));
        return;
      }
      var fl = found.slice().sort(byStage);
      listBox.appendChild(sectionHead(tr("さがした結果"), fl.length, "頭"));
      var fs = el("div","stack");
      fl.forEach(function(m){ fs.appendChild(mareCard(m)); });
      listBox.appendChild(fs);
      return;
    }
    if(examFilter === "今日"){
      paintDueGroups(listBox, todayStr(), "今日", tr("今日やる直検はありません。"));
      return;
    }
    if(examFilter === "今週"){
      paintDueGroups(listBox, addDays(todayStr(), 7), "今週", tr("今週の予定はありません。"));
      return;
    }
    var list = examList().slice();
    list.sort(byStage);
    if(!list.length){
      listBox.appendChild(el("div","empty",
        examFilter === "全頭"
          ? tr("まだ登録がありません。分娩日か種付日を入れると、予定日が自動で出ます。")
          : tr("この分類に入る馬はいません。")));
      return;
    }
    var s = el("div","stack");
    list.forEach(function(m){ s.appendChild(mareCard(m)); });
    listBox.appendChild(s);
  }

  si.addEventListener("input", function(){
    mareQuery = si.value;
    fillSuggest();
    fillList();
  });
  si.addEventListener("focus", fillSuggest);
  si.addEventListener("blur", function(){
    setTimeout(function(){ sug.hidden = true; }, 250);
  });
  si.addEventListener("keydown", function(ev){
    if(ev.key === "Escape"){ sug.hidden = true; si.blur(); }
  });
  sclr.addEventListener("click", function(){
    mareQuery = "";
    si.value = "";
    fillSuggest();
    fillList();
    si.focus();
  });

  fillList();
  if(refocusSearch){
    refocusSearch = false;
    si.focus();
    try{ si.setSelectionRange(si.value.length, si.value.length); }catch(e){ }
    fillSuggest();
  }
}

  if(d === 1) return el("span","chip n", tr("明日"));

/* ----- 予定表（カレンダー） ----- */
function shiftMonth(ym, n){
  var y = Number(ym.slice(0,4)), mo = Number(ym.slice(5,7)) - 1 + n;
  var d = new Date(y, mo, 1);
  return d.getFullYear() + "-" + pad(d.getMonth()+1);
}
function fmtFull(s){
  var p = String(s).split("-");
  if(p.length !== 3) return String(s);
  var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  if(isNaN(d.getTime())) return String(s);
  var wd = WD_ALL[LANG][d.getDay()];
  if(LANG === "ja") return Number(p[1]) + tr("月") + Number(p[2]) + tr("日(") + wd + ")";
  var mon = (LANG === "hi" ? MONTHS_HI : MONTHS_EN)[Number(p[1]) - 1];
  return mon + " " + Number(p[2]) + " (" + wd + ")";
}
function itemsByDate(){
  var map = {};
  mares.forEach(function(m){
    scheduleFor(m).forEach(function(it){
      if(!it.date) return;
      (map[it.date] = map[it.date] || []).push(it);
    });
  });
  return map;
}

function paintCal(view){
  var td = todayStr();
  if(!calMonth) calMonth = td.slice(0,7);
  if(!calSel) calSel = td;
  var map = itemsByDate();
  var foalMap = foalingByDate();

  var y = Number(calMonth.slice(0,4)), mo = Number(calMonth.slice(5,7));

  var head = el("div","cal-head");
  var prev = el("button","cal-nav","‹");
  prev.type = "button";
  prev.setAttribute("aria-label",tr("前の月"));
  prev.addEventListener("click", function(){ calMonth = shiftMonth(calMonth, -1); paint(); });
  var next = el("button","cal-nav","›");
  next.type = "button";
  next.setAttribute("aria-label",tr("次の月"));
  next.addEventListener("click", function(){ calMonth = shiftMonth(calMonth, 1); paint(); });
  head.appendChild(prev);
  head.appendChild(el("div","cal-title",
    LANG === "ja" ? (y + tr("年") + mo + tr("月"))
                  : ((LANG === "hi" ? MONTHS_HI : MONTHS_EN)[mo - 1] + " " + y)));
  head.appendChild(next);
  view.appendChild(head);

  var grid = el("div","cal-grid");
  WD_ALL[LANG].forEach(function(w, i){
    grid.appendChild(el("div","cal-wd" + (i === 0 ? " sun" : i === 6 ? " sat" : ""), w));
  });
  var lead = new Date(y, mo-1, 1).getDay();
  var dim = new Date(y, mo, 0).getDate();
  for(var i = 0; i < lead; i++) grid.appendChild(el("div","cal-pad"));

  for(var d = 1; d <= dim; d++){
    (function(day){
      var ds = y + "-" + pad(mo) + "-" + pad(day);
      var items = map[ds] || [];
      var pend = items.filter(function(it){ return !it.done; });
      var cell = el("button","cal-cell");
      cell.type = "button";
      if(pend.length) cell.classList.add("has");
      if(pend.length && ds < td) cell.classList.add("late");
      if(ds === td) cell.classList.add("today");
      if(ds === calSel) cell.classList.add("sel");
      cell.setAttribute("aria-label", fmtFull(ds) + " " + trf("{n}頭", { n: pend.length }));
      cell.appendChild(el("span","cal-d", String(day)));
      cell.appendChild(el("span","cal-n", pend.length ? String(pend.length) : (items.length ? "✓" : "")));
      if((foalMap[ds] || []).length){
        cell.classList.add("foal");
        cell.appendChild(el("span","cal-foal",""));
      }
      cell.addEventListener("click", function(){ calSel = ds; paint(); });
      grid.appendChild(cell);
    })(d);
  }
  view.appendChild(grid);

  var legend = el("div","cal-legend");
  legend.appendChild(el("span", null, tr("数字＝その日に見る頭数")));
  legend.appendChild(el("span", null, tr("✓＝記録済み")));
  legend.appendChild(el("span", null, tr("色つき＝未記録あり")));
  legend.appendChild(el("span", null, tr("●＝分娩予定")));
  view.appendChild(legend);

  var sel = (map[calSel] || []).slice().sort(function(a,b){
    if(!!a.done !== !!b.done) return a.done ? 1 : -1;
    return String(a.mare.horse || "").localeCompare(String(b.mare.horse || ""), "ja");
  });
  var foals = foalMap[calSel] || [];
  view.appendChild(sectionHead(fmtFull(calSel), sel.length + foals.length, "件"));
  if(!sel.length && !foals.length){
    view.appendChild(el("div","empty",tr("この日の予定はありません。")));
    return;
  }
  var s = el("div","stack");
  foals.forEach(function(m){ s.appendChild(foalCard(m)); });
  sel.forEach(function(it){ s.appendChild(itemCard(it)); });
  view.appendChild(s);
}

/* ============ シート ============ */
var sheet = document.getElementById("sheet");
var sheetBody = document.getElementById("sheetBody");
var sheetFoot = document.getElementById("sheetFoot");
var sheetTitle = document.getElementById("sheetTitle");

function openSheet(title){
  sheetTitle.textContent = title;
  sheetBody.innerHTML = "";
  sheetFoot.innerHTML = "";
  sheet.classList.add("open");
}
function closeSheet(){
  sheet.classList.remove("open");
  sheetBody.innerHTML = "";
  sheetFoot.innerHTML = "";
}
Array.prototype.forEach.call(sheet.querySelectorAll("[data-close]"), function(b){
  b.addEventListener("click", closeSheet);
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && sheet.classList.contains("open")) closeSheet();
});

function field(label, control, hint){
  var w = el("label","field");
  w.appendChild(el("span","field-label",label));
  w.appendChild(control);
  if(hint) w.appendChild(el("span","field-hint",hint));
  return w;
}
function inp(type, value, ph){
  var i = document.createElement("input");
  i.type = type;
  if(value != null) i.value = value;
  if(ph) i.placeholder = ph;
  return i;
}
function sel(options, value){
  var s = document.createElement("select");
  options.forEach(function(o){
    var op = document.createElement("option");
    op.value = o; op.textContent = tr(o);
    s.appendChild(op);
  });
  if(value) s.value = value;
  return s;
}
function ta(value, ph){
  var t = document.createElement("textarea");
  if(value != null) t.value = value;
  if(ph) t.placeholder = ph;
  return t;
}
function footBtns(list){
  list.forEach(function(b){ sheetFoot.appendChild(b); });
}

/* ----- 治療：新規 / 編集 ----- */
function openTreatForm(t){
  openSheet(t ? "治療の内容を編集" : tr("治療を登録"));

  var horse = inp("text", t ? t.horse : "", tr("例：ブルーローズ"));
  horse.setAttribute("list","horseNames");
  var place = inp("text", t ? t.place : "", tr("例：1号厩舎 / 3放牧地"));
  var problem = inp("text", t ? t.problem : "", tr("例：左前肢 蜂窩織炎"));
  var plan = ta(t ? t.plan : "", tr("例：セファゾリン 朝夕2回、患部冷却15分、運動制限"));
  var start = inp("date", t ? t.startDate : todayStr());
  var status = sel(["治療中","経過観察","終了"], t ? t.status : "治療中");

  sheetBody.appendChild(field(tr("馬名"), horse));
  sheetBody.appendChild(field(tr("場所"), place));
  sheetBody.appendChild(field(tr("症状・診断"), problem));
  sheetBody.appendChild(field(tr("処置内容"), plan, tr("誰が見ても同じ処置ができるように書いてください")));
  sheetBody.appendChild(field(tr("開始日"), start));
  sheetBody.appendChild(field(tr("状態"), status));

  var save = el("button","btn t",tr("保存"));
  save.addEventListener("click", async function(){
    if(!horse.value.trim()){ toast(tr("馬名を入力してください")); horse.focus(); return; }
    save.disabled = true;
    var body = {
      horse: horse.value.trim(),
      place: place.value.trim(),
      problem: problem.value.trim(),
      plan: plan.value.trim(),
      startDate: start.value || todayStr(),
      status: status.value,
      updatedAt: new Date().toISOString()
    };
    var ok;
    if(t){
      body.createdBy = t.createdBy || myId || "";
      body.createdAt = t.createdAt || new Date().toISOString();
      ok = await guardedWrite(function(){ return db.doc("treatments/" + t.id).set(body); }, tr("保存しました"));
    }else{
      body.createdBy = myId || "";
      body.createdAt = new Date().toISOString();
      ok = await guardedWrite(function(){ return db.collection("treatments").add(body); }, tr("登録しました"));
    }
    save.disabled = false;
    if(ok) closeSheet();
  });
  var cancel = el("button","btn",tr("やめる"));
  cancel.addEventListener("click", closeSheet);
  footBtns([cancel, save]);
}

    ["治療中","経過観察","終了"].forEach(function(s){

      b.type = "button";
      var isCurrent = ((t.status || "治療中") === s);
      b.setAttribute("aria-pressed", isCurrent ? "true" : "false");
      b.addEventListener("click", async function(){
        if(isCurrent) return;
        var all = seg.querySelectorAll("button");
        Array.prototype.forEach.call(all, function(x){ x.disabled = true; });
        var body = Object.assign({}, t);
        delete body.id;
        body.status = s;
        body.updatedAt = new Date().toISOString();
        var ok = await guardedWrite(function(){
          return db.doc("treatments/" + t.id).set(body);
        }, trf("{s}にしました", { s: tr(s) }));
        if(ok){
          t.status = s;
          openTreatDetail(t.id);
        }else{
          Array.prototype.forEach.call(all, function(x){ x.disabled = false; });
        }
      });
      seg.appendChild(b);
    });
    stBlock.appendChild(seg);
    sheetBody.appendChild(stBlock);

  if(t.status !== "終了" && canWrite()){
    var addLog = el("button","btn t wide",tr("処置を記録"));

    sheetBody.appendChild(addLog);

  var block = el("div","detail-block");
  block.appendChild(el("h3", null, trf("処置の記録（{n}件）", { n: lg.length })));
  if(!lg.length){
    block.appendChild(el("div","log-meta",tr("まだ記録がありません。")));
  }else{
    lg.slice(0,30).forEach(function(l){
      var row = el("div","log");
      row.appendChild(el("div","log-meta", byLine(l.by, l.date)));
      row.appendChild(el("div","log-text", l.text || ""));
      if(canWrite()){
        var del = el("button","btn sm",tr("この記録を削除"));
        del.style.marginTop = "6px";

            del.dataset.armed = "1";
            del.textContent = tr("もう一度押すと削除します");
            setTimeout(function(){
              if(del.dataset.armed === "1"){
                del.dataset.armed = "0";
                del.textContent = tr("この記録を削除");
              }
            }, 4000);
            return;
          }
          del.disabled = true;
          var ok = await guardedWrite(function(){ return db.doc("logs/" + l.id).delete(); }, tr("削除しました"));
          if(ok){

            del.disabled = false;
            del.dataset.armed = "0";
            del.textContent = tr("この記録を削除");

        });

      }
      block.appendChild(row);

  var buttons = [];

/* ----- 繁殖：新規 / 編集 ----- */
function renderPreview(box, foaling, breeding){

  if(foaling){
    var d0 = addDays(foaling, foalOffset());
    if(d0){
      any = true;
      var r0 = el("div","prow");
      r0.appendChild(el("span","prow-label", trl(foalLabelJa())));
      r0.appendChild(el("span","prow-date", fmtDate(d0)));
      box.appendChild(r0);
    }
  }
  if(breeding){
    breedSteps().forEach(function(s){
      var d = addDays(breeding, s[0]);

      any = true;
      var r = el("div","prow");
      r.appendChild(el("span","prow-label", trl(s[1])));
      r.appendChild(el("span","prow-date", fmtDate(d)));

/* ----- 実施の記録 ----- */
var RESULT_SETS = {
  "妊娠鑑定": ["受胎","不受胎","その他"],
  "その他処置": ["実施","中止","その他"]
};
/* 繁殖牝馬の区分 */
var CATEGORY_OPTS = ["未選択","上がり","空胎","子付き"];
var CATEGORY2_OPTS = ["未選択","自馬","預託馬"];
function catOf(m){
  var c = m && m.category;
  return (c && c !== "未選択") ? c : "";
}
function cat2Of(m){
  var c = m && m.category2;
  return (c && c !== "未選択") ? c : "";
}
/** 預託馬のときだけオーナー名を返す */
function ownerOf(m){
  return (cat2Of(m) === "預託馬" && m.owner) ? m.owner : "";
}
/* 馬名の行。区分・預託・厩舎を名前の横に出す */
function horseLine(m){
  var h = el("div","horse", m.horse || tr("（馬名なし）"));
  var c = catOf(m);
  if(c) h.appendChild(el("span","hcat", tr(c)));
  if(cat2Of(m) === "預託馬") h.appendChild(el("span","hcat", tr("預託")));
  if(m.place) h.appendChild(el("span","place", m.place));
  return h;
}

/* ----- 厩舎・分場 ----- */

/** 牧場が登録した厩舎・分場の一覧 */
function barnList(){
  var a = (settings && settings.barns) || [];
  if(Object.prototype.toString.call(a) !== "[object Array]") return [];
  return a.filter(function(x){ return x && String(x).trim(); })
          .map(function(x){ return String(x).trim(); });
}

/** 一覧にない名前が馬についていたら、それも選べるようにしておく */
function barnOptions(current){
  var list = barnList().slice();
  if(current && list.indexOf(current) < 0) list.push(current);
  return list;
}

/** 厩舎・分場を選ぶ欄。新しい名前をその場で足せる */
var BARN_NONE = "（未選択）";
var BARN_ADD = "＋ 新しく追加";
function barnPicker(current){
  var s = sel([BARN_NONE].concat(barnOptions(current)).concat([BARN_ADD]),
              current || BARN_NONE);
  var nameBox = inp("text", "", tr("例：第二分場"));
  nameBox.style.marginTop = "8px";
  nameBox.style.display = "none";
  var wrap = el("div");
  wrap.appendChild(s);
  wrap.appendChild(nameBox);
  s.addEventListener("change", function(){
    var add = (s.value === BARN_ADD);
    nameBox.style.display = add ? "" : "none";
    if(add) nameBox.focus();
  });
  return {
    el: wrap,
    value: function(){
      if(s.value === BARN_ADD) return nameBox.value.trim();
      return (s.value === BARN_NONE) ? "" : s.value;
    },
    isNew: function(){ return s.value === BARN_ADD && !!nameBox.value.trim(); }
  };
}

/** 新しい厩舎・分場の名前を設定に足す（すでにあれば何もしない） */
function addBarn(name){
  var n = String(name || "").trim();
  if(!n) return;
  var list = barnList();
  if(list.indexOf(n) >= 0) return;
  saveSettings({ barns: list.concat([n]) });
}

/** 設定の一部だけを書き換える */
function saveSettings(patch){
  var body = {
    foalOffset: foalOffset(),
    gestation: gestationDays(),
    dueMode: dueMode(),
    steps: (settings && settings.steps) || {},
    barns: barnList()
  };
  Object.keys(patch).forEach(function(k){ body[k] = patch[k]; });
  return db.doc("settings/schedule").set(body);
}

/* 卵胞ボタンの並び（未入力・なし・0.5〜6.0cm） */
var SIZE_OPTS = (function(){
  var a = [{ v:"", label:"未入力" }, { v:"0", label:"なし" }];
  for(var i = 1; i <= 12; i++){ var n = (i * 0.5).toFixed(1); a.push({ v:n, label:n }); }
  return a;
})();

/* 子宮の浮腫。−／＋／＋＋／＋＋＋ で選ぶ */
var EDEMA_OPTS = [
  { v:"",       label:"未入力" },
  { v:"−",      label:"−" },
  { v:"＋",     label:"＋" },
  { v:"＋＋",   label:"＋＋" },
  { v:"＋＋＋", label:"＋＋＋" }
];
function edemaPicker(init){
  var wrap = el("div","edema");
  var cur = "";
  var btns = [];
  EDEMA_OPTS.forEach(function(o){
    var b = el("button","ed-btn", tr(o.label));
    b.type = "button";
    b.setAttribute("aria-pressed","false");
    b.addEventListener("click", function(){
      cur = o.v;
      btns.forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    });
    btns.push(b);
    wrap.appendChild(b);
  });
  var k = 0;
  for(var i = 0; i < EDEMA_OPTS.length; i++){
    if(EDEMA_OPTS[i].v === (init || "")){ k = i; break; }
  }
  cur = EDEMA_OPTS[k].v;
  btns[k].setAttribute("aria-pressed","true");
  return { el: wrap, value: function(){ return cur; } };
}

/* 片側の卵巣。卵胞の大きさと黄体をひとまとめに選ぶ */
function ovaryColumn(titleKey, initSize, initCl){
  var col = el("div","ovary");
  var state = { size: initSize || "", cl: !!initCl };

  /* 見出しを押すと大きさの一覧が開く */
  var head = el("button","ovary-toggle");
  head.type = "button";
  head.setAttribute("aria-expanded","false");
  head.appendChild(el("span","ot-title", tr(titleKey)));
  var val = el("span","ot-val ot-empty");
  var valText = el("span", null, "—");
  var arrow = el("span","ot-arrow","▼");
  val.appendChild(valText);
  val.appendChild(arrow);
  head.appendChild(val);
  col.appendChild(head);

  function showValue(o){
    if(!o || o.v === ""){
      valText.textContent = "—";
      val.className = "ot-val ot-empty";
    }else{
      valText.textContent = (o.v === "0") ? tr("なし") : (o.label + "cm");
      val.className = "ot-val";
    }
  }
  function setOpen(open){
    head.setAttribute("aria-expanded", open ? "true" : "false");
    grid.hidden = !open;
  }
  head.addEventListener("click", function(){
    setOpen(grid.hidden);
  });

  var grid = el("div","sizes");

  var clBtn = el("button","cl-btn", tr("黄体"));
  clBtn.type = "button";
  clBtn.setAttribute("aria-pressed", state.cl ? "true" : "false");
  clBtn.addEventListener("click", function(){
    state.cl = !state.cl;
    clBtn.setAttribute("aria-pressed", state.cl ? "true" : "false");
  });
  col.appendChild(clBtn);

  var btns = [];
  SIZE_OPTS.forEach(function(o){
    var b = el("button","size-btn", tr(o.label));
    b.type = "button";
    b.setAttribute("aria-pressed","false");
    b.addEventListener("click", function(){
      state.size = o.v;
      btns.forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      showValue(o);
      setOpen(false);
    });
    btns.push(b);
    grid.appendChild(b);
  });
  var init = 0;
  for(var k = 0; k < SIZE_OPTS.length; k++){
    if(SIZE_OPTS[k].v === state.size){ init = k; break; }
  }
  btns[init].setAttribute("aria-pressed","true");
  showValue(SIZE_OPTS[init]);
  grid.hidden = true;
  col.appendChild(grid);
  return { el: col, state: state };
}

/* 記録された直検の内容を、画面の言語で1行にする */
function doneText(d){
  if(!d) return "";
  if(d.lf || d.rf || d.cl || d.ed){
    var p = [];
    if(d.lf) p.push(trf("左{v}cm", { v: d.lf }));
    if(d.rf) p.push(trf("右{v}cm", { v: d.rf }));
    if(d.cl) p.push(tr("黄体") + " " + tr(d.cl));
    if(d.ed) p.push(tr("浮腫") + " " + d.ed);
    return p.join("　");
  }
  return tr(d.result || "記録済");
}
function openItemResult(m, it){
  var prev = it.done || null;   /* 記録済みを開き直したとき */
  openSheet(m.horse + "　" + trl(it.label));
  var when = inp("date", (prev && prev.date) || it.date || todayStr());
  var isExam = (it.kind === "直検");
  var result = null, lf = null, rf = null, ed = null;
  sheetBody.appendChild(field(tr("実施日"), when));

  if(isExam){
    var pc = prev ? (prev.cl || "") : "";
    lf = ovaryColumn("左卵胞", prev ? prev.lf : "", pc === "左" || pc === "両側");
    rf = ovaryColumn("右卵胞", prev ? prev.rf : "", pc === "右" || pc === "両側");
    var ov = el("div","ovaries");
    ov.appendChild(lf.el);
    ov.appendChild(rf.el);
    sheetBody.appendChild(ov);
    sheetBody.appendChild(el("div","ovary-note", tr("左卵胞・右卵胞を押すと大きさを選べます（単位はcm）")));

    var edBlock = el("div","detail-block");
    edBlock.style.marginTop = "12px";
    edBlock.appendChild(el("h3", null, tr("子宮の浮腫")));
    ed = edemaPicker(prev ? prev.ed : "");
    edBlock.appendChild(ed.el);
    sheetBody.appendChild(edBlock);
  }else{
    result = sel(RESULT_SETS[it.kind] || ["実施"], prev ? prev.result : null);
    sheetBody.appendChild(field(tr("結果"), result));
  }

  var memo = ta(prev ? (prev.memo || "") : "",
    tr(isExam ? "例：子宮に浮腫あり。2日後に再検" : "例：単胎、左子宮角。次回4週で再検"));
  sheetBody.appendChild(field(tr("所見・申し送り"), memo));

  var bDate = null, bStallion = null;
  if(it.kind !== "その他処置"){
    bDate = inp("date", "");
    sheetBody.appendChild(field(tr("種付日（この直検で種付が決まったら）"), bDate,
      trf("空欄でかまいません。入れるとその日から{steps}の鑑定日が出ます", { steps: stepsLabel() })));
    bStallion = inp("text", "", tr("例：キングカメハメハ"));
    bStallion.setAttribute("list","stallionNames");
    sheetBody.appendChild(field(tr("種牡馬"), bStallion));
  }

  /* 飛ばした回も記録として残し、予定からは外す */
  var skipBox = el("div","detail-block");
  skipBox.style.marginTop = "14px";
  var skipBtn = el("button","btn wide", tr("この回は飛ばす"));
  skipBtn.addEventListener("click", function(){ commit(true, skipBtn); });
  skipBox.appendChild(skipBtn);
  skipBox.appendChild(el("div","log-meta",
    tr("都合で実施しなかったときに押します。予定一覧から外れ、記録には「未実施」として残ります。あとで取り消せます。")));
  sheetBody.appendChild(skipBox);

  async function commit(skip, btn){
    btn.disabled = true;
    var body = Object.assign({}, m);
    delete body.id;
    var nd = Object.assign({}, body.done || {});
    var rec = {
      label: it.label,
      kind: it.kind,
      date: when.value || todayStr(),
      memo: memo.value.trim(),
      by: myId || "",
      at: new Date().toISOString()
    };
    if(skip){
      rec.result = "未実施";
    }else if(isExam){
      var vl = lf.state.size;
      var vr = rf.state.size;
      var vc = (lf.state.cl && rf.state.cl) ? "両側" : lf.state.cl ? "左" : rf.state.cl ? "右" : "";
      var ve = ed ? ed.value() : "";
      rec.lf = vl; rec.rf = vr; rec.cl = vc; rec.ed = ve;
      var parts = [];
      if(vl) parts.push("左" + vl + "cm");
      if(vr) parts.push("右" + vr + "cm");
      if(vc) parts.push("黄体" + vc);
      if(ve) parts.push("浮腫" + ve);
      rec.result = parts.join(" ");
    }else{
      rec.result = result.value;
    }
    nd[it.key] = rec;
    body.done = nd;
    if(!skip && bDate && bDate.value){
      body.breedingDate = bDate.value;
      if(bStallion && bStallion.value.trim()) body.stallion = bStallion.value.trim();
    }
    body.updatedAt = new Date().toISOString();
    var ok = await guardedWrite(function(){ return db.doc("mares/" + m.id).set(body); },
      tr(skip ? "飛ばしました" : prev ? "保存しました" : "記録しました"));
    btn.disabled = false;
    if(ok){
      m.done = nd;
      if(!skip && bDate && bDate.value){ m.breedingDate = body.breedingDate; m.stallion = body.stallion; m.manual = body.manual; }
      openMareDetail(m.id);
    }
  }

  var save = el("button","btn e", tr(prev ? "保存" : "実施済にする"));
  save.addEventListener("click", function(){ commit(false, save); });
  var back = el("button","btn",tr("やめる"));
  back.addEventListener("click", function(){ openMareDetail(m.id); });
  footBtns([back, save]);
}

  bBlock.appendChild(el("div","log-meta",
    tr("馬の「厩舎・分場」で選べるようになります。")
    + tr("ここで消しても、その名前がついている馬はそのままです。")));
  sheetBody.appendChild(bBlock);

  var block = el("div","detail-block");
  block.appendChild(el("h3", null, tr("妊娠鑑定でつくる予定")));
  var picks = {};
  ALL_STEPS.forEach(function(s){
    var on = stepOn(s[0]);
    picks[s[0]] = function(){ return on; };
    var row = el("button","toggle-row");
    row.type = "button";
    row.setAttribute("aria-pressed", on ? "true" : "false");
    row.appendChild(el("span","toggle-label", trf("{label}（種付後{n}日）", { label: trl(s[1]), n: s[0] })));
    var state = el("span","toggle-state", on ? tr("使う") : tr("使わない"));
    row.appendChild(state);
    row.addEventListener("click", function(){
      if(!editable){ toast(tr("このアカウントでは変更できません")); return; }
      on = !on;
      row.setAttribute("aria-pressed", on ? "true" : "false");
      state.textContent = on ? tr("使う") : tr("使わない");
    });
    block.appendChild(row);
  });
  block.appendChild(el("div","log-meta",
    tr("チェックを外した項目は、これから先の予定に出なくなります。すでに記録した結果は履歴に残ります。この設定はこのボードを見る全員に共通です。")));
  sheetBody.appendChild(block);

  if(editable){
    var pw = el("div","detail-block");
    pw.appendChild(el("h3", null, tr("合言葉")));
    var np = inp("password", "", tr("新しい合言葉"));
    pw.appendChild(field(tr("新しい合言葉"), np, tr("空欄のまま保存すると、合言葉なし（URLを知っていれば誰でも開ける）に戻ります")));
    var pwNote = el("div","log-meta",
      tr("合言葉を決めると、ボードを開くときに聞かれるようになります。")
      + tr("変更したときは、従業員の方に新しい合言葉を伝えてください。")
      + tr("この合言葉は画面の鍵で、データそのものの鍵ではありません。"));
    pw.appendChild(pwNote);
    var pwBtn = el("button","btn wide",tr("合言葉を保存する"));
    pwBtn.style.marginTop = "10px";
    pwBtn.addEventListener("click", async function(){
      pwBtn.disabled = true;
      pwBtn.textContent = tr("保存しています…");
      try{
        var v = np.value.trim();
        var r = await callServer("setPasscode", v);
        setPasscodeLocal(v);
        toast(r && r.hasPass ? tr("合言葉を設定しました") : tr("合言葉を解除しました"));
        np.value = "";
      }catch(e){
        toast(tr("保存できませんでした"));
      }
      pwBtn.disabled = false;
      pwBtn.textContent = tr("合言葉を保存する");
    });
    pw.appendChild(pwBtn);
    sheetBody.appendChild(pw);

    var season = el("div","detail-block");
    season.appendChild(el("h3", null, tr("年度の管理")));

    var lbl = inp("text", String(new Date().getFullYear()), tr("例：2026"));
    season.appendChild(field(tr("年度の名前"), lbl, tr("保存するファイルの名前に使います")));

    var keep = true;
    var keepRow = el("button","toggle-row");
    keepRow.type = "button";
    keepRow.setAttribute("aria-pressed","true");
    keepRow.appendChild(el("span","toggle-label",tr("馬名・厩舎・区分・メモを引き継ぐ")));
    var keepState = el("span","toggle-state", tr("引き継ぐ"));
    keepRow.appendChild(keepState);
    keepRow.addEventListener("click", function(){
      keep = !keep;
      keepRow.setAttribute("aria-pressed", keep ? "true" : "false");
      keepState.textContent = keep ? tr("引き継ぐ") : tr("引き継がない");
    });
    season.appendChild(keepRow);

    var snote = el("div","log-meta",
      tr("「保存する」は今の記録をコピーして別ファイルに残します。アプリのデータはそのままです。")
      + tr("「新しいシーズンを始める」は、保存したうえで分娩日・種付日・直検の記録を消します。治療の記録は消えません。"));
    snote.style.marginTop = "10px";
    season.appendChild(snote);

    var snote2 = el("div","log-meta",
      tr("この2つは電波のあるときだけ使えます。新しい画面が開き、そこで確認してから実行されます。"));
    snote2.style.marginTop = "6px";
    season.appendChild(snote2);

    function openSeasonPage(act){
      var u = SEASON_URL
        + "?farm=" + encodeURIComponent(FARM)
        + "&do=" + encodeURIComponent(act)
        + "&label=" + encodeURIComponent(lbl.value.trim() || String(new Date().getFullYear()))
        + "&keep=" + (keep ? "1" : "0");
      window.open(u, "_blank");
    }

    var b1 = el("button","btn wide",tr("今の記録を保存する"));
    b1.style.marginTop = "10px";
    b1.addEventListener("click", function(){
      if(fromCache){ toast(tr("電波のある場所でお試しください")); return; }
      openSeasonPage("archive");
    });
    season.appendChild(b1);

    var b2 = el("button","btn wide",tr("新しいシーズンを始める"));
    b2.style.marginTop = "8px";
    b2.addEventListener("click", function(){
      if(fromCache){ toast(tr("電波のある場所でお試しください")); return; }
      openSeasonPage("newseason");
    });
    season.appendChild(b2);

    sheetBody.appendChild(season);
  }

  var ver = el("p","field-hint", tr("アプリの版") + "：" + APP_VERSION);
  ver.style.textAlign = "center";
  ver.style.marginTop = "16px";
  sheetBody.appendChild(ver);

  var buttons = [];
  var close = el("button","btn",tr("閉じる"));
  close.addEventListener("click", closeSheet);
  buttons.push(close);

  if(editable){
    var save = el("button","btn e",tr("保存"));
    save.addEventListener("click", async function(){
      save.disabled = true;
      var n = Number(fo.value);
      var g2 = Number(gd.value);
      var body = {
        foalOffset: (n > 0 && n < 100) ? n : 8,
        gestation: (g2 > 200 && g2 < 400) ? g2 : 340,
        dueMode: (mode === "calendar") ? "calendar" : "days",
        barns: barns.slice(),
        steps: {}
      };
      ALL_STEPS.forEach(function(s){ body.steps[String(s[0])] = !!picks[s[0]](); });
      var ok = await guardedWrite(function(){ return db.doc("settings/schedule").set(body); }, tr("設定を保存しました"));
      save.disabled = false;
      if(ok){ settings = body; closeSheet(); }
    });
    buttons.push(save);
  }
  footBtns(buttons);
}
document.getElementById("settingsBtn").addEventListener("click", function(){
  openSettings();
});

  var b = e.target.closest("button[data-tab]");

<script>
/* 画面そのものをこの端末に残して、電波がなくても開けるようにする */
(function(){
  if(!("serviceWorker" in navigator)) return;

  /* すでに控えから動いていた場合だけ、新しい版に入れ替わったら開き直す。
     入力の途中（画面が開いているとき）には開き直さない。 */
  var had = !!navigator.serviceWorker.controller;
  var done = false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(!had || done) return;
    var sheet = document.getElementById("sheet");
    if(sheet && sheet.classList.contains("open")) return;
    done = true;
    location.reload();
  });

  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      function look(){ try{ reg.update(); }catch(e){ } }
      setTimeout(look, 3000);
      /* アプリに戻ってくるたびに、新しい版が出ていないか見にいく */
      document.addEventListener("visibilitychange", function(){
        if(document.visibilityState === "visible") look();
      });
    }).catch(function(){ /* 失敗しても動く */ });
  });
})();

/* アプリ情報ファイル（manifest）は iPhone/iPad では読み込ませない。
   iOS は manifest があるとそちらの開始ページを優先してしまい、
   リンクに付けた牧場コードが落ちてしまうため。 */
(function(){
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if(isIOS) return;
  var ml = document.createElement("link");
  ml.rel = "manifest";
  ml.href = "manifest.webmanifest";
  document.head.appendChild(ml);
})();
</script>
